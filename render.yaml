# Render blueprint: one always-on web service with a small persistent disk for the SQLite database.
services:
  - type: web
    name: mna-flat-search
    runtime: python
    plan: starter            # the free plan sleeps and has no disk, which would lose likes and notes
    region: frankfurt        # closest Render region to London
    buildCommand: pip install -r rental_app/requirements.txt
    startCommand: python rental_app/app.py
    healthCheckPath: /api/me
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FLAT_PASSWORD     # entered in the Render dashboard, never committed
        sync: false
      - key: TFL_APP_KEY
        sync: false
      - key: EPC_API_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY # optional: floorplan room-size reading
        sync: false
      - key: PROXY_URL         # optional: residential proxy if a portal blocks Render's servers
        sync: false
